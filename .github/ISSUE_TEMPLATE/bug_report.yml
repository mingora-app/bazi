name: Calculation bug
description: Report a reproducible calculation or API problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove names and other personal information before submitting birth data.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: Include date, time, IANA time zone, longitude, solar-time mode, and day-boundary policy.
      render: ts
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and independent reference
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Relevant boundary
      options:
        - None known
        - Solar term or Li Chun
        - Midnight or Zi hour
        - DST gap or overlap
        - True-solar date rollover
        - Historical time-zone change
    validations:
      required: true
